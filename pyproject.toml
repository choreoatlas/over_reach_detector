[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "over-reach-detector"
version = "0.0.5"
description = "Detect when AI code changes exceed declared task scope (MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ChoreoAtlas" }]
keywords = ["mcp", "ai", "code-review", "scope-detection", "cursor", "claude-code"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/choreoatlas/over_reach_detector"
Repository = "https://github.com/choreoatlas/over_reach_detector"

[project.scripts]
over-reach-detector = "over_reach_detector.server:main"

[tool.setuptools.packages.find]
include = ["over_reach_detector*"]
